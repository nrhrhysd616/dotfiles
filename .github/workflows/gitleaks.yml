# プルリクエストのたびにシークレットの混入を検査する
#
# ローカルのpre-commitフック(git/hooks/pre-commit)は --no-verify で飛ばせるうえ、
# huskyなどがcore.hooksPathを上書きするプロジェクトでは動かない。
# このリポジトリはpublicなので、公開前の最後の砦としてCIでも同じ検査を走らせる。
#
# GITLEAKS_LICENSEは組織アカウントのリポジトリでのみ必要になるため設定しない。
# @see https://github.com/gitleaks/gitleaks-action
name: gitleaks

# pushトリガーは付けない。PRブランチへのpushではpull_requestと二重に発火して
# 同じコミットを二度検査することになり、かといってmainへのpushに絞ると
# 検出がマージ後になって遅い。マージ前のPRで止めるのが目的なのでこれだけでよい
on:
  pull_request:
  workflow_dispatch:

# gitleaks-actionは検出内容をプルリクエストへコメントする(GITLEAKS_ENABLE_COMMENTS)
permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # gitleaks-actionはベースからHEADまでのコミット範囲を検査するため、
          # 浅いcloneだと範囲を辿れない(公式のワークフロー例と同じ指定)
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
